name: Set up Canasta PHP stack
description: >-
  Install PHP, its extensions, Composer and the other tools CanastaBase ships,
  from Debian packages, inside a Debian container job. The package list mirrors
  CanastaBase's Dockerfile (minus Apache/FPM, which CLI tests do not need) so
  that CI tests the pins on the same PHP that Canasta runs in production.
  Unversioned php-* metapackages track whatever PHP the Debian release ships
  (8.2 on Debian 12, 8.4 on Debian 13).

runs:
  using: composite
  steps:
    - name: Install Debian packages
      shell: bash
      run: |
        set -euxo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates \
          curl \
          git \
          unzip \
          patch \
          procps \
          poppler-utils \
          imagemagick \
          librsvg2-bin \
          ghostscript \
          python3 \
          python3-yaml \
          python3-pygments \
          python-is-python3 \
          php-cli \
          php-mysql \
          php-gd \
          php-mbstring \
          php-xml \
          php-intl \
          php-opcache \
          php-apcu \
          php-redis \
          php-curl \
          php-zip \
          php-yaml \
          php-ldap \
          php-bcmath \
          php-luasandbox
        rm -rf /var/lib/apt/lists/*
        . /etc/os-release
        echo "Debian ${VERSION_ID}"
        php --version

    # Composer the way CanastaBase installs it: the verified upstream
    # installer, latest 2.x. Debian's own composer package is too old for
    # the --no-security-blocking flag and the advisory policy config used
    # below.
    - name: Install Composer
      shell: bash
      run: |
        set -euxo pipefail
        curl -sS https://getcomposer.org/installer -o /tmp/composer-setup.php
        EXPECTED_CHECKSUM="$(curl -sS https://composer.github.io/installer.sig)"
        ACTUAL_CHECKSUM="$(sha384sum /tmp/composer-setup.php | cut -d' ' -f1)"
        [ "$EXPECTED_CHECKSUM" = "$ACTUAL_CHECKSUM" ]
        php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
        rm /tmp/composer-setup.php
        composer --version
